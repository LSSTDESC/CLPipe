name: docs

# Builds the Sphinx HTML docs on every PR/push touching them (as a check),
# and publishes to GitHub Pages on pushes to main.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [autodoc, main]
    paths: ["docs/**", "clpipe/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "clpipe/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install doc dependencies
        run: pip install -r docs/requirements.txt

      - name: Build HTML docs
        working-directory: docs
        run: make html

      - name: Upload artifact (for inspection and Pages)
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/autodoc')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
