name: firecrown_clp
channels:
  - conda-forge
dependencies:
  - alabaster
  - babel
  - black
  - charset-normalizer
  - compilers <= 1.8
  - cosmosis >= 3.0, < 3.26
  - cosmosis-build-standard-library
  - coverage
  - cython
  - dill
  - fitsio
  - flake8
  - flake8-docstrings
  - fuzzywuzzy
  - getdist
  - glib
  - idna
  - matplotlib-base
  - more-itertools
  - mypy
  - numpy >= 2.0, < 2.4
  - numcosmo >= 0.27
  - pip >= 20.1
  - portalocker
  - pybobyqa
  - pyccl =3.2.1
  - pydantic
  - pylint
  - pytest
  - pytest-cov
  - python >=3.12
  - pyyaml
  - requests
  - sacc >= 2.1
  - scipy
  - tabulate
  - types-pyyaml
  - urllib3
  - jupyter
  - graphviz
  - pytest-xdist
  - hypothesis
  - plotnine < 0.15
  - rich
  - typer
  - types-requests
  - linkchecker
  - pytest-json-report
  - sphinx
  - sphinx-autoapi
  - sphinx-autodoc-typehints
  - sphinx-rtd-theme
  - myst-nb
  - sphinxcontrib-apidoc
  - pip:
    - ceci ==2.5
    - qp-prob
    - clmm ==1.16.1
    - git+https://github.com/LSSTDESC/firecrown@v1.16.0
    - tjpcov==0.6.0
    - autoclasstoc
    - cobaya
    - isitgr
    - lsstdesc-crow ==1.0.12
    - sphinx_copybutton
