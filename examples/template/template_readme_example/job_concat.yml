id: TXPipe
site:
    name: $TXPIPE_SITE
    max_threads: 4
launcher:
    name: mini
    interval: 0.5
modules: >
    txpipe
    txpipe.extensions
    rail.estimation.algos.bpz_lite
python_paths: []
stages:
  - name: TXSourceTomography
    threads_per_process: 4
  - name: TXSourceSelectorMetadetect
    nprocess: 4
  - name: BPZliteInformer
    nprocess: 1
    aliases:
        input: spectroscopic_catalog
        model: photoz_model
  - name: BPZliteEstimator
    nprocess: 4
    aliases:
        model: photoz_model
        input: shear_catalog
        output: source_photoz_pdfs
  - name: CLClusterBinningRedshiftRichness
    nprocess: 1
  - name: CLClusterShearCatalogs
    nprocess: 4
  - name: CLClusterEnsembleProfiles
    nprocess: 4
  - name: CLClusterSACC
    nprocess: 1
    aliases:
        cluster_profiles: cluster_profiles
output_dir: $TXPIPE_OUTPUTDIR
log_dir: $LOGDIR
config: $CONFIG_FILE
inputs:
    shear_catalog: $TXPIPE_DATADIR/$DATADIR/metadetect_shear_catalog.hdf5
    fiducial_cosmology: $FIDUCIAL_COSMOLOGY
    spectroscopic_catalog: $TXPIPE_DATADIR/$DATADIR/mock_spectroscopic_catalog.hdf5
    cluster_catalog: $TXPIPE_DATADIR/$DATADIR/cluster_catalog.hdf5
resume: true
pipeline_log: $LOGDIR/log_txpipe.txt
---
id: TJPCov
modules: clpipe
launcher:
    name: mini
    interval: 0.5
site:
    name: local
    max_threads: 4
stages:
  - name: CLPCovariance
    module_name: clpipe.clp_covariance
    nprocess: 1
inputs:
    clusters_sacc_file: $TXPIPE_OUTPUTDIR/cluster_sacc_catalog.sacc
    fiducial_cosmology: $FIDUCIAL_COSMOLOGY
config: $CONFIG_FILE
resume: false
output_dir: $OUTPUTDIR
log_dir: $LOGDIR
---
id: Firecrown
modules: clpipe
launcher:
    name: mini
    interval: 0.5
site:
    name: local
    max_threads: 4
stages:
  - name: CLPFirecrown
    module_name: clpipe.clp_firecrown
    nprocess: 1
inputs:
    clusters_sacc_file_cov: $OUTPUTDIR/clusters_sacc_file_cov.sacc
    fiducial_cosmology: $FIDUCIAL_COSMOLOGY
config: $CONFIG_FILE
resume: false
output_dir: $OUTPUTDIR
log_dir: $LOGDIR
