id: TJPCov
modules: clpipe
launcher:
    name: mini
    interval: 0.5
site:
    name: local
    max_threads: 4
stages:
  - name: CLPCovariance
    module_name: clpipe.clp_covariance
    nprocess: 1
inputs:
    fiducial_cosmology: ../../data/fiducial_cosmology_cosmodc2.yml
    clusters_sacc_file: ./clusters_sacc_file.sacc
config: ./cosmodc2_config_both.yml
resume: false
output_dir: ./outputs_both
log_dir: ./logs_both
