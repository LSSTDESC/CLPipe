global:
    metacalibration: True
CLPFirecrown:
    hmf: 'despali16'
    min_mass: 13.0
    max_mass: 15.3
    min_z: 0.2
    max_z: 1.0
    mass_def: '200c'
    use_shear_profile: False
    use_completeness: False
    use_purity: False
    use_grid: True
    is_deltasigma: True
    use_beta_interp: False
    beta_parameters: [10.0, 5.0]
    pivot_mass: 14.3
    pivot_z: 0.5
    survey_name: 'cosmodc2_halos'
    sampler: 'emcee'
    use_cluster_counts: True
    use_mean_log_mass: False
    use_mean_deltasigma: False
    set_concentration: False
    emcee_walkers: 100
    emcee_samples: 20000
    emcee_nsteps: 200
    cosmological_parameters:
        omega_c: {'sample': True, 'values': [0.1, 0.2052, 0.4]}
        sigma_8: {'sample': True, 'values': [0.5, 0.800, 1.0]}
    firecrown_parameters:
        mass_distribution_mu0: {'sample': True, 'values': [2.0, 2.0, 10.0]}
        mass_distribution_mu1: {'sample': True, 'values': [0.01, 0.8, 10.0]}
        mass_distribution_mu2: {'sample': True, 'values': [-2.0, 0.8, 2.0]}
        mass_distribution_sigma0: {'sample': True, 'values': [0.0, 0.3, 10.0]}
        mass_distribution_sigma1: {'sample': False, 'values': 0.0}
        mass_distribution_sigma2: {'sample': False, 'values': 0.0}
CLPCovariance:
    use_mpi: False
    do_xi: False
    #cov_type: [ClusterCountsGaussian]
    #cov_type: [ClusterMass, ClusterCountsGaussian, ClusterCountsSSC]
    cov_type: [ClusterCountsGaussian, ClusterCountsSSC]
    replace_tjpcov_cov: False
    photo-z:
        # from DES Y1
        sigma_0: 0.005
    mor_parameters:
        #halo mass function parameters
        mass_func: 'Despali16'
        mass_def: '200c'
        halo_bias: 'Tinker10'
        min_halo_mass: 1.0e13
        max_halo_mass: 2.0e15
        #richness-mass relation parameters (from eq (14) in https://arxiv.org/pdf/1904.07524):
        m_pivot: 14.3
        z_pivot: 0.5
        mu_p0: 3.2
        mu_p1: 0.8
        mu_p2: 0.1
        sigma_p0: 0.50
        sigma_p1: 0.0
        sigma_p2: 0.0
