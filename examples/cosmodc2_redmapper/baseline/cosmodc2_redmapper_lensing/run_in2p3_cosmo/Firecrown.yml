id: Firecrown
modules: clpipe
launcher:
    name: mini
    interval: 0.5
site:
    name: local
    max_threads: 4
stages:
  - name: CLPFirecrown
    module_name: clpipe.clp_firecrown
    nprocess: 1
    aliases:
      sampler_file: cluster_counts_mean_mass_redshift_richness
      likelihood_file: cluster_redshift_richness
      priors_file: cluster_richness_values
inputs:
    fiducial_cosmology: /sps/lsst/groups/clusters/cl_pipeline_project/TXPipe_data/cosmodc2/fiducial_cosmology.yml
    clusters_sacc_file_cov: ./outputs_cosmo/clusters_sacc_file_cov.sacc
config: ./config_in2p3_cosmo.yml
resume: false
output_dir: ./outputs_cosmo
log_dir: ./logs_cosmo
