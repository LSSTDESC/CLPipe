id: Firecrown
modules: clpipe
launcher:
    name: mini
    interval: 0.5
site:
    name: local
    max_threads: 4
stages:
  - name: CLPFirecrown
    module_name: clpipe.clp_firecrown
    nprocess: 1
    aliases:
      sampler_file: cluster_counts_mean_mass_redshift_richness
      likelihood_file: cluster_redshift_richness
      priors_file: cluster_richness_values
inputs:
    clusters_sacc_file_cov: $OUTPUTDIR/clusters_sacc_file_cov.sacc
    fiducial_cosmology: $TXPIPE_DATADIR/$DATADIR_FULL/../fiducial_cosmology.yml
config: $CONFIG_FILE
resume: false
output_dir: $OUTPUTDIR
log_dir: $LOGDIR
---
id: TXPipe
site:
    name: local
    max_threads: 60
launcher:
    name: mini
    interval: 0.5
modules: >
    txpipe
    txpipe.extensions
    rail.estimation.algos.bpz_lite
python_paths: []
stages:
  - name: TXSourceTomography
    threads_per_process: 4
  - name: TXSourceSelectorMetadetect
    nprocess: 60
  - name: BPZliteInformer
    nprocess: 1
    aliases:
        input: spectroscopic_catalog
        model: photoz_model
  - name: BPZliteEstimator
    nprocess: 60
    aliases:
        model: photoz_model
        input: shear_catalog
        output: source_photoz_pdfs
  - name: CLClusterBinningRedshiftRichness
    nprocess: 1
  - name: CLClusterShearCatalogs
    nprocess: 10   #>1 does not work with mpi
  - name: CLClusterEnsembleProfiles
    nprocess: 10
  - name: CLClusterSACC
    nprocess: 1
    aliases:
        cluster_profiles: cluster_profiles
output_dir: $TXPIPE_OUTPUTDIR
log_dir: $LOGDIR
config: $CONFIG_FILE
inputs:
    # See README for paths to download these files
    shear_catalog: $TXPIPE_DATADIR/$DATADIR_FULL/shear_catalog.hdf5
    #photometry_catalog:  /sps/lsst/users/mricci/TXPipe_data/data_link/cosmodc2/20deg2/photometry_catalog.hdf5
    fiducial_cosmology: $TXPIPE_DATADIR/$DATADIR_FULL/../fiducial_cosmology.yml
    calibration_table: 
        $TXPIPE_DATADIR/$DATADIR_20DEG2/sample_cosmodc2_w10year_errors.dat
    spectroscopic_catalog: 
        $TXPIPE_DATADIR/$DATADIR_20DEG2/spectroscopic_catalog.hdf5
    cluster_catalog: $TXPIPE_DATADIR/$DATADIR_FULL/cluster_catalog.hdf5
    #shear_tomography_catalog: ./data/example/outputs_metadetect/shear_tomography_catalog.hdf5
    #source_photoz_pdfs: ./data/example/inputs/photoz_pdfs.hdf5
resume: true
pipeline_log: $LOGDIR/log_$RUNIDENTIFIER.txt
---
id: TJPCov
modules: clpipe
launcher:
    name: mini
    interval: 0.5
site:
    name: local
    max_threads: 4
stages:
  - name: CLPCovariance
    module_name: clpipe.clp_covariance
    nprocess: 1
inputs:
    clusters_sacc_file: $TXPIPE_OUTPUTDIR/cluster_sacc_catalog.sacc
    fiducial_cosmology: $TXPIPE_DATADIR/$DATADIR_FULL/../fiducial_cosmology.yml
config: $CONFIG_FILE
resume: false
output_dir: $OUTPUTDIR
log_dir: $LOGDIR
--- null
...
