id: Firecrown
modules: clpipe
launcher:
    name: mini
    interval: 0.5
site:
    name: local
    max_threads: 4
stages:
  - name: CLPFirecrown
    module_name: clpipe.clp_firecrown
    nprocess: 1
inputs:
    fiducial_cosmology: ../../../data/fiducial_cosmology_cosmodc2.yml
    clusters_sacc_file_cov: ./outputs_both/clusters_sacc_file_cov.sacc
config: ./config_in2p3_both.yml
resume: false
output_dir: ./outputs_both
log_dir: ./logs_both
